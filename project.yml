name: Batteries
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: ${BUNDLE_ID_PREFIX}
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Batteries:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batteries
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Batteries
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
    dependencies:
      - target: BatteriesWatch
  BatteriesWatch:
    type: application
    platform: watchOS
    sources: [Watch, WatchShared, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batteries.watchkitapp
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Batteries
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).batteries
        AppGroup: group.$(BUNDLE_ID_PREFIX).batteries
    entitlements:
      path: Watch/BatteriesWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).batteries]
    dependencies:
      - target: BatteriesWidget
  BatteriesWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, WatchShared, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).batteries.watchkitapp.widget
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Batteries
        AppGroup: group.$(BUNDLE_ID_PREFIX).batteries
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/BatteriesWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).batteries]
schemes:
  Batteries:
    build:
      targets:
        Batteries: all
    archive:
      config: Release